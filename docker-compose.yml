name: crm

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-crm-ak}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-crm-sk-change-me}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-crm-ak}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-crm-sk-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-attachments}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\" &&
      mc mb --ignore-existing local/\"$$MINIO_BUCKET\" &&
      echo 'bucket ready: '$$MINIO_BUCKET
      "

  # ---------------------------------------------------------------------
  # IA LOCAL. Corre en ESTA maquina, no en la nube: ninguna foto, ninguna
  # nota de voz y ningun texto de cliente sale del equipo.
  # ---------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: crm-ollama
    restart: unless-stopped
    # SIN `ports`: Ollama no tiene autenticacion y expone un endpoint que
    # ejecuta modelos. Publicarlo en 0.0.0.0 es abrir el servidor a la red.
    # El backend lo alcanza por el nombre de servicio.
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      # Volumen nombrado, no bind mount del host: el directorio de modelos del
      # host es $HOME del usuario ollama con permisos 700 y el daemon de
      # docker puede estar en otro host. Un volumen es reproducible.
      # La PRIMERA vez hay que bajar el modelo:
      #   docker compose exec ollama ollama pull granite3.3:2b
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: &localai_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Whisper para las notas de voz. Sin puertos por el mismo motivo.
  # threads=2 a proposito: el equipo tiene 12 nucleos pero el backend, Postgres
  # y Ollama ya viven en la misma maquina. Subirlo a 8 deja el inbox lento.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: crm-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_ENGINE: faster_whisper
      ASR_DEVICE: cpu
      ASR_THREADS: "2"
      ASR_MODEL_PATH: /model
      MODEL_PATH: /model
    volumes:
      - whisperdata:/model
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9000/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *localai_logs

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      OLLAMA_BASE_URL: http://ollama:11434
      ASR_BASE_URL: http://whisper:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
      whisper:
        condition: service_started
    # El backend tambien rota logs: es el que mas escribe (una linea por
    # mensaje analizado) y el que mas duele si se llena el disco.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: crm-frontend
    restart: unless-stopped
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: crm-cloudflared
    restart: unless-stopped
    command: tunnel --url http://frontend:80
    depends_on:
      - frontend

volumes:
  pgdata:
  miniodata:
  ollamadata:
  whisperdata: